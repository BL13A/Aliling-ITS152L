<div class="add-post-container">
  <h2>Add New Post</h2>

  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Title:</label><br>
      <input type="text" [(ngModel)]="title" name="title" required />
    </div>

    <div>
      <label>Body:</label><br>
      <textarea [(ngModel)]="body" name="body" rows="5" required></textarea>
    </div>

    <button type="submit">Submit Post</button>
  </form>

 
  <button type="button" (click)="goToPostList()">Show List</button>
</div>
